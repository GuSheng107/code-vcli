name: CLI 跨平台验证

on:
  push:
    branches: [master, "release/**"]
  pull_request:
    branches: [master]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v5
      - name: 设置 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 测试
        run: npm test
      - name: npm 打包检查
        run: npm pack --dry-run
